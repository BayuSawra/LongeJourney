interface:
  display_name: "Lore 剧情连续性"
  short_description: "仅在用户明确要求查询、新增、修改或校验正典时使用"
  default_prompt: "Use $lore only if the user explicitly asked to query, add, edit, or validate lore/canon. Read SKILL.md once, then do the work in a single pass. Do not read docs/task_checkpoint.md or lore files to decide whether the skill applies. If the skill does not apply, stop immediately. After lore edits, run tools/check_lore_canon.py once (and tools/update_lore_index.py only if the index is stale). If it fails, fix reported issues, re-run once, then stop. If no lore file changed, do not validate or re-read anything."
