interface:
  display_name: "Lore 剧情连续性"
  short_description: "维护剧情、角色、地点与时间线的连续性，让故事世界保持一致"
  default_prompt: "Use $lore to keep story continuity. Start from docs/task_checkpoint.md and reuse checks already recorded there; when the applicable scope is recorded and unchanged, treat the skill instructions and relevant lore entries as loaded and do not re-read SKILL.md or the lore source files. Work in a single pass, and if no lore file changed this round, do not validate, log, or re-read anything. After content work, before commit, run tools/check_lore_canon.py once and run tools/update_lore_index.py when the index needs syncing. If it passes, log a check only when the scope changed, commit immediately, and stop without running another validation loop. If it fails, fix only the reported issues, re-run once, and stop with a report if it still fails."
