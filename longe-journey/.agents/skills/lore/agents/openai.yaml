interface:
  display_name: "Lore 剧情连续性"
  short_description: "维护剧情、角色、地点与时间线的连续性，让故事世界保持一致"
  default_prompt: "Use $lore to keep story continuity. First read docs/task_checkpoint.md and reuse checks already recorded there; do not review or re-read lore entries that have already been checked unless the entry, scope, or stage changed. For new or modified entries, review only the incremental scope, and log each completed check with its scope and result so later threads do not repeat it."
