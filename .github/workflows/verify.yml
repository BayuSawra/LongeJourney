name: Verify long-journey

on:
  push:
    paths: ["long-journey/**", ".github/workflows/verify.yml"]
  pull_request:
    paths: ["long-journey/**", ".github/workflows/verify.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned Godot (verified SHA512)
        shell: powershell
        run: |
          $godot = & ./long-journey/tools/setup_env.ps1
          "GODOT_PATH=$godot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify tools, content and game
        shell: powershell
        run: |
          python -m unittest discover -s long-journey/tools/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python long-journey/tools/verify.py
          exit $LASTEXITCODE
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: long-journey/reports/
          if-no-files-found: warn
          retention-days: 7
